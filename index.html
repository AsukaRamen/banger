<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADIO MIX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: #121212;
            position: relative;
            overflow: hidden;
        }
        .bg-blur {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-size: cover;
            background-position: center;
            filter: blur(60px) brightness(0.5);
            transform: scale(1.2);
            transition: background-image 0.8s ease;
            z-index: 0;
        }
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1;
        }

        .donate-corner {
            position: fixed;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s ease;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-weight: 400;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .donate-corner:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.15);
        }
        .donate-corner svg {
            width: 16px;
            height: 16px;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 420px;
            width: 100%;
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 24px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .station-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #fff;
        }
        .time-header {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

        .cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #181818;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }
        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info {
            text-align: center;
            margin-bottom: 12px;
        }
        .title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 2px;
            min-height: 26px;
            color: #fff;
            letter-spacing: -0.2px;
        }
        .artist {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.4);
            min-height: 20px;
            font-weight: 400;
        }

        .player-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .time-current,
        .time-total {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.25);
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }
        .time-total {
            text-align: right;
        }
        .progress-track {
            flex: 1;
            height: 3px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 4px;
            transition: width 0.05s linear;
        }
        .progress-track:hover .progress-fill {
            background: #fff;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin: 2px 0;
        }
        .controls button {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
        }
        #play-btn {
            font-size: 28px;
            width: 56px;
            height: 56px;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        #play-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .volume-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 8px 0 2px;
            padding: 0 4px;
            height: 32px;
            position: relative;
        }
        .volume-icon {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.2);
            min-width: 22px;
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .volume-icon:hover {
            color: rgba(255, 255, 255, 0.5);
        }
        .volume-slider-container {
            flex: 1;
            height: 100%;
            display: flex;
            align-items: center;
            position: relative;
        }
        .volume-slider {
            width: 100%;
            height: 3px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            outline: none;
            transition: all 0.3s ease;
            opacity: 0;
            cursor: default;
        }
        .volume-wrapper:hover .volume-slider {
            opacity: 1;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        .volume-slider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            border: none;
        }
        .volume-slider:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .volume-slider::-webkit-slider-thumb:hover {
            background: #fff;
        }
        .volume-slider::-moz-range-thumb:hover {
            background: #fff;
        }
        .volume-percent {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            min-width: 34px;
            text-align: right;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .volume-wrapper:hover .volume-percent {
            opacity: 1;
        }

        .waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 22px;
            margin: 2px 0 4px;
        }
        .wave {
            width: 3px;
            height: 6px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        .wave.active {
            background: rgba(255, 255, 255, 0.3);
            animation: waveAnim 0.6s ease-in-out infinite alternate;
        }
        .wave:nth-child(1) { animation-delay: 0s; height: 6px; }
        .wave:nth-child(2) { animation-delay: 0.1s; height: 10px; }
        .wave:nth-child(3) { animation-delay: 0.2s; height: 16px; }
        .wave:nth-child(4) { animation-delay: 0.3s; height: 12px; }
        .wave:nth-child(5) { animation-delay: 0.15s; height: 8px; }
        .wave:nth-child(6) { animation-delay: 0.25s; height: 14px; }
        .wave:nth-child(7) { animation-delay: 0.05s; height: 6px; }
        .wave:nth-child(8) { animation-delay: 0.35s; height: 10px; }
        @keyframes waveAnim {
            0% { height: 4px; }
            100% { height: 18px; }
        }
        .waves.paused .wave {
            animation: none;
            height: 5px !important;
            background: rgba(255, 255, 255, 0.04);
        }

        .footer-note {
            margin-top: 12px;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.3px;
        }
        .footer-note span {
            color: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 480px) {
            .container { padding: 18px 14px 14px; border-radius: 18px; }
            .station-name { font-size: 17px; }
            .title { font-size: 16px; }
            .cover-wrap { border-radius: 12px; }
            #play-btn { width: 48px; height: 48px; font-size: 24px; }
            .controls button { width: 36px; height: 36px; font-size: 17px; }
            .time-current, .time-total { font-size: 10px; min-width: 30px; }
            .volume-slider::-webkit-slider-thumb { width: 11px; height: 11px; }
            .donate-corner {
                bottom: 16px;
                left: 16px;
                font-size: 11px;
                padding: 6px 12px;
            }
            .donate-corner svg { width: 14px; height: 14px; }
        }
        @media (max-width: 380px) {
            .container { padding: 14px 10px 10px; }
            .station-name { font-size: 15px; }
            .title { font-size: 14px; }
            .donate-corner {
                bottom: 12px;
                left: 12px;
                font-size: 10px;
                padding: 4px 10px;
            }
            .donate-corner svg { width: 12px; height: 12px; }
        }
    </style>
</head>

            { file: "https://dl.dropboxusercontent.com/scl/fi/x1mfzc9e6nk6uymeh845a/bbno-1-800-feat.-Ironmouse.mp3?rlkey=9irhuwf64mqnktfmjebo2sz16&st=lkyjxu4p&dl=1", artist: "bbno$", title: "1-800", cover: "https://t2.genius.com/unsafe/323x323/https%3A%2F%2Fimages.genius.com%2F49e4a3ce69371cbdb11f5820a7917d43.1000x1000x1.png" },
        ];

        // ===== КОД =====
        let currentTrackIndex = 0;
        let playing = false;
        let isDragging = false;

        const audio = new Audio();
        const bgBlur = document.getElementById('bgBlur');
        const coverImg = document.getElementById('cover');
        const playBtn = document.getElementById('playBtn');
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeTotal = document.getElementById('timeTotal');
        const waves = document.getElementById('waves');
        const timeHeader = document.getElementById('timeHeader');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumePercent = document.getElementById('volumePercent');

        // ===== ГРОМКОСТЬ =====
        audio.volume = 0.8;
        volumeSlider.value = 0.8;
        volumePercent.textContent = '80%';

        volumeSlider.addEventListener('input', function() {
            const val = parseFloat(this.value);
            audio.volume = val;
            volumePercent.textContent = Math.round(val * 100) + '%';
        });

        // ===== ВРЕМЯ =====
        function updateTime() {
            const now = new Date();
            const str = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            timeHeader.textContent = str;
        }
        updateTime();
        setInterval(updateTime, 10000);

        function formatTime(s) {
            if (isNaN(s) || !isFinite(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return m + ':' + (sec < 10 ? '0' : '') + sec;
        }

        function updateProgress() {
            if (!isDragging && audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                timeCurrent.textContent = formatTime(audio.currentTime);
            }
        }

        function setProgress(e) {
            const rect = progressTrack.getBoundingClientRect();
            const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
            progressFill.style.width = x * 100 + '%';
            audio.currentTime = x * audio.duration;
            timeCurrent.textContent = formatTime(audio.currentTime);
        }

        progressTrack.addEventListener('mousedown', (e) => { isDragging = true; setProgress(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) setProgress(e); });
        document.addEventListener('mouseup', () => { isDragging = false; });

        progressTrack.addEventListener('touchstart', (e) => {
            isDragging = true;
            setProgress(e.touches[0]);
        });
        document.addEventListener('touchmove', (e) => {
            if (isDragging) setProgress(e.touches[0]);
        });
        document.addEventListener('touchend', () => { isDragging = false; });

        function playTrack(index) {
            if (!TRACKS.length) return;
            const track = TRACKS[index];
            if (!track) return;

            document.getElementById('title').textContent = track.title || 'Untitled';
            document.getElementById('artist').textContent = track.artist || 'Unknown';

            if (track.cover) {
                coverImg.src = track.cover;
                bgBlur.style.backgroundImage = `url(${track.cover})`;
            }

            audio.src = track.file;
            audio.load();
            
            // Принудительный старт после загрузки
            audio.oncanplay = function() {
                if (playing) {
                    audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
                }
                audio.oncanplay = null;
            };

            // Если уже загружено — сразу играем
            if (audio.readyState >= 3 && playing) {
                audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
            }

            updateBtn();

            // Media Session
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title || 'Untitled',
                    artist: track.artist || 'Unknown',
                    album: 'RADIO MIX',
                    artwork: [
                        { src: track.cover || 'https://upload.wikimedia.org/wikipedia/en/a/a3/Kanyewest_collegedropout.jpg', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });
                navigator.mediaSession.setActionHandler('play', () => { audio.play(); updateBtn(); });
                navigator.mediaSession.setActionHandler('pause', () => { audio.pause(); updateBtn(); });
                navigator.mediaSession.setActionHandler('previoustrack', prevTrack);
                navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
            }
        }

        function updateBtn() {
            if (audio.paused) {
                playBtn.textContent = '▶';
                playing = false;
                waves.classList.add('paused');
            } else {
                playBtn.textContent = '⏸';
                playing = true;
                waves.classList.remove('paused');
            }
        }

        function togglePlay() {
            if (!TRACKS.length) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
            updateBtn();
        }

        function nextTrack() {
            if (!TRACKS.length) return;
            let newIndex;
            do {
                newIndex = Math.floor(Math.random() * TRACKS.length);
            } while (TRACKS.length > 1 && newIndex === currentTrackIndex);
            currentTrackIndex = newIndex;
            playTrack(currentTrackIndex);
            if (playing) {
                audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
            }
        }

        function prevTrack() {
            nextTrack();
        }

        // ===== ФОН ВКЛАДКА =====
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && playing && audio.paused) {
                audio.play().catch(e => console.log('Не удалось возобновить'));
            }
        });

        // ===== СОБЫТИЯ =====
        audio.addEventListener('canplay', function() {
            if (playing) {
                audio.play().catch(e => console.log('Автовоспроизведение заблокировано'));
            }
        });

        audio.addEventListener('ended', nextTrack);
        audio.addEventListener('play', updateBtn);
        audio.addEventListener('pause', updateBtn);
        audio.addEventListener('timeupdate', updateProgress);
        audio.addEventListener('loadedmetadata', () => {
            timeTotal.textContent = formatTime(audio.duration);
        });

        playBtn.addEventListener('click', togglePlay);
        document.getElementById('next').addEventListener('click', nextTrack);
        document.getElementById('prev').addEventListener('click', prevTrack);

        // ===== СТАРТ =====
        currentTrackIndex = Math.floor(Math.random() * TRACKS.length);
        playing = true;
        playTrack(currentTrackIndex);
    </script>
