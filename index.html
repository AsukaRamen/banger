<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADIO MIX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.8s ease;
            background: #0a0a0a;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            transition: background 0.8s ease;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .station-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .time-header { font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 300; }

        .cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #111;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info { text-align: center; margin-bottom: 14px; }
        .title { font-size: 19px; font-weight: 700; margin-bottom: 2px; min-height: 26px; }
        .artist { font-size: 14px; color: rgba(255,255,255,0.5); min-height: 20px; }

        .player-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .time-current, .time-total {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }
        .time-total { text-align: right; }
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 4px;
            transition: width 0.05s linear;
        }
        .progress-track:hover .progress-fill { background: #1db954; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin: 4px 0 2px;
        }
        .controls button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover { color: #fff; background: rgba(255,255,255,0.05); }
        #play-btn {
            font-size: 30px;
            width: 58px;
            height: 58px;
            color: #fff;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #play-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }
        .bottom-time { font-size: 12px; color: rgba(255,255,255,0.25); }

        .footer-note {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.3px;
        }
        .footer-note span { color: rgba(255,255,255,0.3); }

        .waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 22px;
            margin: 4px 0 6px;
        }
        .wave {
            width: 3px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        .wave.active {
            background: rgba(255,255,255,0.5);
            animation: waveAnim 0.6s ease-in-out infinite alternate;
        }
        .wave:nth-child(1) { animation-delay: 0s; height: 6px; }
        .wave:nth-child(2) { animation-delay: 0.1s; height: 10px; }
        .wave:nth-child(3) { animation-delay: 0.2s; height: 16px; }
        .wave:nth-child(4) { animation-delay: 0.3s; height: 12px; }
        .wave:nth-child(5) { animation-delay: 0.15s; height: 8px; }
        .wave:nth-child(6) { animation-delay: 0.25s; height: 14px; }
        .wave:nth-child(7) { animation-delay: 0.05s; height: 6px; }
        .wave:nth-child(8) { animation-delay: 0.35s; height: 10px; }
        @keyframes waveAnim {
            0% { height: 4px; }
            100% { height: 18px; }
        }
        .waves.paused .wave { animation: none; height: 5px !important; background: rgba(255,255,255,0.06); }

        @media (max-width: 480px) {
            .container { padding: 18px 14px 14px; border-radius: 20px; }
            .station-name { font-size: 17px; }
            .title { font-size: 16px; }
            .cover-wrap { border-radius: 14px; }
            #play-btn { width: 50px; height: 50px; font-size: 24px; }
            .controls button { width: 38px; height: 38px; font-size: 18px; }
            .bottom-row { font-size: 11px; flex-wrap: wrap; gap: 6px; justify-content: center; }
            .time-current, .time-total { font-size: 10px; min-width: 30px; }
        }
        @media (max-width: 380px) {
            .container { padding: 14px 10px 10px; }
            .station-name { font-size: 15px; }
            .title { font-size: 14px; }
        }
    </style>
</head>

        </div>

        <div class="wave"></div><div class="wave"></div><div class="wave"></div>

    </div>

</div>

        { file: "https://dl.dropboxusercontent.com/scl/fi/x1mfzc9e6nk6uymeh845a/bbno-1-800-feat.-Ironmouse.mp3?rlkey=9irhuwf64mqnktfmjebo2sz16&st=lkyjxu4p&dl=1", artist: "bbno$", title: "1-800", cover: "https://t2.genius.com/unsafe/323x323/https%3A%2F%2Fimages.genius.com%2F49e4a3ce69371cbdb11f5820a7917d43.1000x1000x1.png" },
    ];

    // ===== КОД ПЛЕЕРА =====
    let currentTrackIndex = 0;
    let playing = false;
    let isDragging = false;

    const audio = new Audio();
    const container = document.getElementById('container');
    const coverImg = document.getElementById('cover');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const waves = document.getElementById('waves');
    const bottomTime = document.getElementById('bottomTime');
    const timeHeader = document.getElementById('timeHeader');

    function updateTime() {
        const now = new Date();
        const str = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        timeHeader.textContent = str;
        bottomTime.textContent = str;
    }
    updateTime();
    setInterval(updateTime, 1000);

    function formatTime(s) {
        if (isNaN(s) || !isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    function updateProgress() {
        if (!isDragging && audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            timeCurrent.textContent = formatTime(audio.currentTime);
        }
    }

    function setProgress(e) {
        const rect = progressTrack.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        progressFill.style.width = x * 100 + '%';
        audio.currentTime = x * audio.duration;
        timeCurrent.textContent = formatTime(audio.currentTime);
    }

    progressTrack.addEventListener('mousedown', (e) => { isDragging = true; setProgress(e); });
    document.addEventListener('mousemove', (e) => { if (isDragging) setProgress(e); });
    document.addEventListener('mouseup', () => { isDragging = false; });

    progressTrack.addEventListener('touchstart', (e) => {
        isDragging = true;
        setProgress(e.touches[0]);
    });
    document.addEventListener('touchmove', (e) => {
        if (isDragging) setProgress(e.touches[0]);
    });
    document.addEventListener('touchend', () => { isDragging = false; });

    function playTrack(index) {
        if (!TRACKS.length) return;
        const track = TRACKS[index];
        if (!track) return;

        document.getElementById('title').textContent = track.title || 'Untitled';
        document.getElementById('artist').textContent = track.artist || 'Unknown';
        if (track.cover) {
            coverImg.src = track.cover;
        }

        audio.src = track.file;
        audio.load();
        if (playing) audio.play();
        updateBtn();
        extractColor(coverImg);
    }

    function updateBtn() {
        if (audio.paused) {
            playBtn.textContent = '▶';
            playing = false;
            waves.classList.add('paused');
        } else {
            playBtn.textContent = '⏸';
            playing = true;
            waves.classList.remove('paused');
        }
    }

    function togglePlay() {
        if (!TRACKS.length) return;
        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }
        updateBtn();
    }

    function nextTrack() {
        if (!TRACKS.length) return;
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * TRACKS.length);
        } while (TRACKS.length > 1 && newIndex === currentTrackIndex);
        currentTrackIndex = newIndex;
        playTrack(currentTrackIndex);
        if (playing) audio.play();
    }

    function prevTrack() {
        nextTrack();
    }

    // ===== ЦВЕТ ИЗ ОБЛОЖКИ =====
    function extractColor(img) {
        if (!img.complete || !img.naturalWidth) {
            img.onload = () => extractColor(img);
            return;
        }
        try {
            const canvas = document.createElement('canvas');
            canvas.width = 50;
            canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 50, 50);
            const data = ctx.getImageData(0, 0, 50, 50).data;
            let r = 0, g = 0, b = 0, count = 0;
            for (let i = 0; i < data.length; i += 4) {
                const dr = data[i], dg = data[i+1], db = data[i+2];
                if (dr + dg + db < 60) continue;
                r += dr; g += dg; b += db;
                count++;
            }
            if (count === 0) { r = 20; g = 20; b = 30; count = 1; }
            r = Math.floor(r / count);
            g = Math.floor(g / count);
            b = Math.floor(b / count);
            const bg = `rgb(${Math.floor(r*0.12)}, ${Math.floor(g*0.12)}, ${Math.floor(b*0.12)})`;
            const containerBg = `rgba(${r*0.06}, ${g*0.06}, ${b*0.06}, 0.5)`;
            document.body.style.background = bg;
            container.style.background = containerBg;
        } catch(e) {}
    }

    audio.addEventListener('ended', nextTrack);
    audio.addEventListener('play', updateBtn);
    audio.addEventListener('pause', updateBtn);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = formatTime(audio.duration);
    });

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('next').addEventListener('click', nextTrack);
    document.getElementById('prev').addEventListener('click', prevTrack);

    currentTrackIndex = Math.floor(Math.random() * TRACKS.length);
    playTrack(currentTrackIndex);
</script>
