<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADIO MIX</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.8s ease;
            background: #0a0a0a;
        }
        .container {
            max-width: 420px;
            width: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            transition: background 0.8s ease;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .station-name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .time-header { font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 300; }

        .cover-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1/1;
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #111;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .cover-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .track-info { text-align: center; margin-bottom: 14px; }
        .title { font-size: 19px; font-weight: 700; margin-bottom: 2px; min-height: 26px; }
        .artist { font-size: 14px; color: rgba(255,255,255,0.5); min-height: 20px; }

        .player-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .time-current, .time-total {
            font-size: 11px;
            color: rgba(255,255,255,0.35);
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }
        .time-total { text-align: right; }
        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            cursor: pointer;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: #fff;
            border-radius: 4px;
            transition: width 0.05s linear;
        }
        .progress-track:hover .progress-fill { background: #1db954; }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin: 4px 0 2px;
        }
        .controls button {
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.5);
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .controls button:hover { color: #fff; background: rgba(255,255,255,0.05); }
        #play-btn {
            font-size: 30px;
            width: 58px;
            height: 58px;
            color: #fff;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #play-btn:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); }

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 12px;
            color: rgba(255,255,255,0.3);
        }
        .listeners {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255,255,255,0.4);
        }
        .listeners .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #1db954;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }
        .listeners .count {
            font-weight: 600;
            color: rgba(255,255,255,0.6);
        }
        .bottom-time { font-size: 12px; color: rgba(255,255,255,0.25); }

        .footer-note {
            margin-top: 14px;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 0.3px;
        }
        .footer-note span { color: rgba(255,255,255,0.3); }

        .waves {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: 22px;
            margin: 4px 0 6px;
        }
        .wave {
            width: 3px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 2px;
            transition: height 0.1s ease;
        }
        .wave.active {
            background: rgba(255,255,255,0.5);
            animation: waveAnim 0.6s ease-in-out infinite alternate;
        }
        .wave:nth-child(1) { animation-delay: 0s; height: 6px; }
        .wave:nth-child(2) { animation-delay: 0.1s; height: 10px; }
        .wave:nth-child(3) { animation-delay: 0.2s; height: 16px; }
        .wave:nth-child(4) { animation-delay: 0.3s; height: 12px; }
        .wave:nth-child(5) { animation-delay: 0.15s; height: 8px; }
        .wave:nth-child(6) { animation-delay: 0.25s; height: 14px; }
        .wave:nth-child(7) { animation-delay: 0.05s; height: 6px; }
        .wave:nth-child(8) { animation-delay: 0.35s; height: 10px; }
        @keyframes waveAnim {
            0% { height: 4px; }
            100% { height: 18px; }
        }
        .waves.paused .wave { animation: none; height: 5px !important; background: rgba(255,255,255,0.06); }

        @media (max-width: 480px) {
            .container { padding: 18px 14px 14px; border-radius: 20px; }
            .station-name { font-size: 17px; }
            .title { font-size: 16px; }
            .cover-wrap { border-radius: 14px; }
            #play-btn { width: 50px; height: 50px; font-size: 24px; }
            .controls button { width: 38px; height: 38px; font-size: 18px; }
            .bottom-row { font-size: 11px; flex-wrap: wrap; gap: 6px; justify-content: center; }
            .time-current, .time-total { font-size: 10px; min-width: 30px; }
        }
        @media (max-width: 380px) {
            .container { padding: 14px 10px 10px; }
            .station-name { font-size: 15px; }
            .title { font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="container" id="container">
    <div class="header">
        <span class="station-name">RADIO MIX</span>
        <span class="time-header" id="timeHeader">--:--</span>
    </div>

    <div class="cover-wrap">
        <img id="cover" src="https://upload.wikimedia.org/wikipedia/en/a/a5/Kanyewest_collegedropout.jpg" alt="Обложка">
    </div>

    <div class="track-info">
        <div class="title" id="title">Загрузка...</div>
        <div class="artist" id="artist"></div>
    </div>

    <div class="player-bar">
        <span class="time-current" id="timeCurrent">0:00</span>
        <div class="progress-track" id="progressTrack">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <span class="time-total" id="timeTotal">0:00</span>
    </div>

    <div class="waves" id="waves">
        <div class="wave"></div><div class="wave"></div><div class="wave"></div>
        <div class="wave"></div><div class="wave"></div><div class="wave"></div>
        <div class="wave"></div><div class="wave"></div>
    </div>

    <div class="controls">
        <button id="prev">⏮</button>
        <button id="playBtn">▶</button>
        <button id="next">⏭</button>
    </div>

    <div class="bottom-row">
        <div class="listeners">
            <span class="dot"></span>
            <span class="count" id="listenersCount">0</span> Online
        </div>
        <span class="bottom-time" id="bottomTime">--:--</span>
    </div>

    <div class="footer-note">
        <span>We don't make money. Just isten to the music.</span>
    </div>
</div>

<script>
    // ===== НАСТРОЙКИ =====
    // songs.txt на Dropbox (прямая ссылка)
    const SONGS_URL = 'https://dl.dropboxusercontent.com/s/rhjtxvzh7o87jele9mzym/songs.txt?rlkey=x8zajubaozhhgx7bvt2ck6pfc&st=8mdips92&dl=1';
    // ИЛИ: https://www.dropbox.com/s/.../songs.txt?dl=1

    let tracks = [];
    let currentTrackIndex = 0;
    let playing = false;
    let isDragging = false;
    let listenersCount = 0;

    const audio = new Audio();
    const container = document.getElementById('container');
    const coverImg = document.getElementById('cover');
    const playBtn = document.getElementById('playBtn');
    const progressFill = document.getElementById('progressFill');
    const progressTrack = document.getElementById('progressTrack');
    const timeCurrent = document.getElementById('timeCurrent');
    const timeTotal = document.getElementById('timeTotal');
    const waves = document.getElementById('waves');
    const listenersEl = document.getElementById('listenersCount');
    const bottomTime = document.getElementById('bottomTime');
    const timeHeader = document.getElementById('timeHeader');

    // ===== СЧЁТЧИК СЛУШАТЕЛЕЙ (рандом) =====
    function updateListeners() {
        // Имитация — меняется медленно, чтобы не дёргалось
        const base = 12;
        const variation = Math.floor(Math.random() * 15);
        listenersCount = base + variation;
        listenersEl.textContent = listenersCount;
    }
    updateListeners();
    setInterval(updateListeners, 30000);

    // ===== ВРЕМЯ =====
    function updateTime() {
        const now = new Date();
        const str = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        timeHeader.textContent = str;
        bottomTime.textContent = str;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // ===== ФОРМАТ ВРЕМЕНИ =====
    function formatTime(s) {
        if (isNaN(s) || !isFinite(s)) return '0:00';
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    // ===== ПРОГРЕСС =====
    function updateProgress() {
        if (!isDragging && audio.duration) {
            const pct = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = pct + '%';
            timeCurrent.textContent = formatTime(audio.currentTime);
        }
    }

    function setProgress(e) {
        const rect = progressTrack.getBoundingClientRect();
        const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
        progressFill.style.width = x * 100 + '%';
        audio.currentTime = x * audio.duration;
        timeCurrent.textContent = formatTime(audio.currentTime);
    }

    progressTrack.addEventListener('mousedown', (e) => { isDragging = true; setProgress(e); });
    document.addEventListener('mousemove', (e) => { if (isDragging) setProgress(e); });
    document.addEventListener('mouseup', () => { isDragging = false; });

    // touch events
    progressTrack.addEventListener('touchstart', (e) => {
        isDragging = true;
        setProgress(e.touches[0]);
    });
    document.addEventListener('touchmove', (e) => {
        if (isDragging) setProgress(e.touches[0]);
    });
    document.addEventListener('touchend', () => { isDragging = false; });

    // ===== ПЛЕЙЛИСТ =====
    function playTrack(index) {
        if (!tracks.length) return;
        const track = tracks[index];
        if (!track) return;

        document.getElementById('title').textContent = track.title || 'Untitled';
        document.getElementById('artist').textContent = track.artist || 'Unknown';
        coverImg.src = track.cover || 'https://upload.wikimedia.org/wikipedia/en/a/a5/Kanyewest_collegedropout.jpg';

        audio.src = track.file;
        audio.load();
        if (playing) audio.play();
        updateBtn();

        // Меняем фон под обложку
        extractColor(coverImg);
    }

    function updateBtn() {
        if (audio.paused) {
            playBtn.textContent = '▶';
            playing = false;
            waves.classList.add('paused');
        } else {
            playBtn.textContent = '⏸';
            playing = true;
            waves.classList.remove('paused');
        }
    }

    function togglePlay() {
        if (!tracks.length) return;
        if (audio.paused) {
            audio.play();
        } else {
            audio.pause();
        }
        updateBtn();
    }

    function nextTrack() {
        if (!tracks.length) return;
        let newIndex;
        do {
            newIndex = Math.floor(Math.random() * tracks.length);
        } while (tracks.length > 1 && newIndex === currentTrackIndex);
        currentTrackIndex = newIndex;
        playTrack(currentTrackIndex);
        if (playing) audio.play();
    }

    function prevTrack() {
        nextTrack();
    }

    function parseSongs(text) {
        const lines = text.split('\n').filter(line => line.trim() && line.startsWith('http'));
        const result = [];

        for (const line of lines) {
            const urlMatch = line.match(/^(https?:\/\/[^\s]+)/);
            if (!urlMatch) continue;
            const file = urlMatch[1];

            const artistMatch = line.match(/\[([^\]]+)\]/);
            const artist = artistMatch ? artistMatch[1] : 'Unknown';

            const titleMatch = line.match(/<([^>]+)>/);
            const title = titleMatch ? titleMatch[1] : 'Untitled';

            const albumMatch = line.match(/#([^\s]+)/);
            const album = albumMatch ? albumMatch[1] : '';
            let cover = 'https://upload.wikimedia.org/wikipedia/en/a/a5/Kanyewest_collegedropout.jpg';
            const a = album.toLowerCase();
            if (a.includes('graduation')) {
                cover = 'https://upload.wikimedia.org/wikipedia/en/thumb/5/57/Graduation_%28Kanye_West_album%29_cover.png/220px-Graduation_%28Kanye_West_album%29_cover.png';
            } else if (a.includes('late') || a.includes('registration')) {
                cover = 'https://upload.wikimedia.org/wikipedia/en/thumb/7/72/Late_registration_cover.jpg/220px-Late_registration_cover.jpg';
            }

            result.push({ file, artist, title, cover });
        }
        return result;
    }

    async function loadTracks() {
        try {
            const response = await fetch(SONGS_URL + '?' + Date.now());
            const text = await response.text();
            tracks = parseSongs(text);

            if (!tracks.length) {
                document.getElementById('title').textContent = '⚠️ Нет треков';
                return;
            }

            currentTrackIndex = Math.floor(Math.random() * tracks.length);
            playTrack(currentTrackIndex);
        } catch (e) {
            document.getElementById('title').textContent = '⚠️ Ошибка загрузки songs.txt';
            console.error(e);
        }
    }

    function extractColor(img) {
        if (!img.complete || !img.naturalWidth) {
            img.onload = () => extractColor(img);
            return;
        }

        try {
            const canvas = document.createElement('canvas');
            canvas.width = 50;
            canvas.height = 50;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, 50, 50);

            const data = ctx.getImageData(0, 0, 50, 50).data;
            let r = 0, g = 0, b = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
                const dr = data[i], dg = data[i+1], db = data[i+2];
                // пропускаем слишком тёмные пиксели
                if (dr + dg + db < 60) continue;
                r += dr; g += dg; b += db;
                count++;
            }

            if (count === 0) { r = 20; g = 20; b = 30; count = 1; }
            r = Math.floor(r / count);
            g = Math.floor(g / count);
            b = Math.floor(b / count);

            // Делаем цвет приглушённым для фона
            const bg = `rgb(${Math.floor(r*0.15)}, ${Math.floor(g*0.15)}, ${Math.floor(b*0.15)})`;
            const containerBg = `rgba(${r*0.08}, ${g*0.08}, ${b*0.08}, 0.6)`;

            document.body.style.background = bg;
            container.style.background = containerBg;
        } catch (e) {}
    }

    audio.addEventListener('ended', nextTrack);
    audio.addEventListener('play', updateBtn);
    audio.addEventListener('pause', updateBtn);
    audio.addEventListener('timeupdate', updateProgress);
    audio.addEventListener('loadedmetadata', () => {
        timeTotal.textContent = formatTime(audio.duration);
    });

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('next').addEventListener('click', nextTrack);
    document.getElementById('prev').addEventListener('click', prevTrack);

    loadTracks();

    setInterval(loadTracks, 60000);
</script>

</body>
</html>

</body>
</html>
